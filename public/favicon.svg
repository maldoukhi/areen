<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Areen">
  <title>Areen</title>
  <!-- The den: an open arch. The legs stay open so the mark reads as shelter, not enclosure. -->
  <path d="M12 52V32a20 20 0 0 1 40 0v20"
        fill="none" stroke="#61B5D1" stroke-width="6" stroke-linecap="round"/>
  <!-- Inside the den: three bars rising right-to-left, following the reading direction. -->
  <g fill="#61B5D1">
    <rect x="19.75" y="32" width="5.5" height="23" rx="2.75"/>
    <rect x="29.25" y="40" width="5.5" height="15" rx="2.75"/>
    <rect x="38.75" y="46" width="5.5" height="9" rx="2.75"/>
  </g>
</svg>
